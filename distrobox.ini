# Development box for wayrdp (rootless Podman + Distrobox).
#
#   distrobox assemble create --replace --file distrobox.ini
#   distrobox enter wayrdp-dev
#
# Also builds mwc, so wayrdp can be tested against it in the same box.
[wayrdp-dev]
image=docker.io/library/ubuntu:26.04
additional_packages="build-essential pkg-config git meson ninja-build"
additional_packages="libwayland-dev wayland-protocols libxkbcommon-dev"
additional_packages="libpixman-1-dev libdrm-dev libgbm-dev libjansson-dev libpam0g-dev"
additional_packages="freerdp3-dev libwinpr3-dev freerdp3-x11 freerdp3-wayland"
additional_packages="libwlroots-0.19-dev libcairo2-dev libpango1.0-dev"
additional_packages="libxcb1-dev libxcb-icccm4-dev xwayland foot grim valgrind"
additional_flags="--tmpfs /tmp/.X11-unix:mode=1777"
